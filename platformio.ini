[platformio]
default_envs = sender

[env]
platform = espressif32
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM*
build_flags =
  -D WIFI_CHANNEL=1
  -D TANK_HEIGHT_M=1.488
  -D TANK_LENGTH_M=2.194
  -D TANK_WIDTH_M=1.8
  -D SENSOR_OFFSET_M=0.1
  -D BATTERY_ADC_PIN=A0
  -D BATTERY_DIVIDER_RATIO=2.0
  -D BATTERY_CALIBRATION=1.0
  -D POWER_PIN=D2
  -D SLEEP_INTERVAL_S=300
  -D SENSOR_WARMUP_MS=1000
  -D OLED_TIMEOUT_MS=30000

[env:sender]
build_src_filter = +<sender.cpp>

[env:sender-debug]
extends = env:sender
build_flags =
  ${env.build_flags}
  -D SENDER_STAY_AWAKE
  -D SENDER_POWER_TEST

[env:receiver]
build_src_filter = +<receiver.cpp>
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
